{% extends 'base.html' %}
{% block title %}Навички{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 style="font-size:1rem; margin:0;">Твої навички</h4>
</div>

<div class="row g-4">
    {% for skill in skills %}
    <div class="col-md-4">
        <a href="{% url 'skill_detail' skill.pk %}" style="text-decoration:none;">
            <div class="sq-card h-100 p-4" style="border-color: {{ skill.color }}33;">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h5 style="font-family:'Cinzel',serif; color:{{ skill.color }}; font-size:.95rem; margin:0;">
                        {{ skill.name }}
                    </h5>
                    <span style="font-size:.78rem; color:{{ skill.color }};
                                 border:1px solid {{ skill.color }}44; padding:.2rem .5rem; border-radius:3px;">
                        Lv.{{ skill.level }}
                    </span>
                </div>

                <div class="mb-2">
                    <div class="xp-track" style="background: {{ skill.color }}18;">
                        <div class="xp-fill" style="width:{{ skill.xp_percent }}%; background:{{ skill.color }};"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between" style="font-size:.72rem; color:var(--text-dim);">
                    <span>{{ skill.xp }} / {{ skill.xp_to_next_level }} XP</span>
                    <span>{{ skill.quests.count }} квестів</span>
                </div>
            </div>
        </a>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="sq-card p-5 text-center text-dim">Немає навичок</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
