{% extends 'base.html' %}
{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top:4rem;">
<div class="col-md-4">
    <div class="text-center mb-4">
        <!-- <h2 style="font-family:'Cinzel',serif; color:var(--gold); font-size:1.6rem; letter-spacing:.1em;">
            Назва
        </h2>-->
        <p class="text-dim" style="font-size:.78rem;">Увійди, щоб продовжити</p>
    </div>

    <div class="sq-card">
        <div class="p-4">
            {% if form.non_field_errors %}
            <div style="color:var(--rose); font-size:.78rem; margin-bottom:1rem; padding:.5rem;
                        border:1px solid rgba(244,63,94,.3); border-radius:4px; background:rgba(244,63,94,.06);">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="d-flex flex-column gap-3">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'/' }}">
                <div>
                    <label class="form-label">Ім'я користувача</label>
                    <input type="text" name="username" class="form-control" placeholder="username" required autofocus>
                </div>
                <div>
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-sq-primary" style="width:100%; padding:.6rem; margin-top:.5rem;">
                    Увійти
                </button>
            </form>

            <div class="text-center mt-3" style="font-size:.75rem; color:var(--text-dim);">
                Немає акаунта? <a href="{% url 'register' %}">Створити</a>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
