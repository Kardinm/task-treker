{% extends 'base.html' %}
{% block title %}Видалити квест{% endblock %}

{% block content %}
<div class="row">
<div class="col-md-5 mx-auto">
    <div class="card border-danger">
        <div class="card-header text-danger">
            <h5 class="mb-0">Підтвердження видалення</h5>
        </div>
        <div class="card-body">
            <p>Ви впевнені, що хочете видалити квест <strong>{{ quest.title }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Видалити</button>
                    <a href="{% url 'quest_detail' quest.pk %}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
