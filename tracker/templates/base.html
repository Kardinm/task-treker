<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% load static %}{% static 'css/custom.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">Головна</a>
        <div class="navbar-nav ms-auto align-items-center">
            {% if user.is_authenticated %}
                <span class="nav-link text-warning">
                    Lv.{{ user.playerprofile.player_level }}, {{ user.playerprofile.title }}
                </span>
                <a class="nav-link" href="{% url 'quest_list' %}">Квести</a>
                <a class="nav-link" href="{% url 'skill_list' %}">Навички</a>
                <a class="nav-link" href="{% url 'boss_list' %}">Боси</a>
                 <!-- <a class="nav-link" href="{% url 'logout' %}">Вийти</a> --> 
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Увійти</a>
                <a class="nav-link" href="{% url 'register' %}">Реєстрація</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
