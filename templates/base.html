{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}...{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --accent: #e94560;
            --text: #eaeaea;
            --muted: #a0a0a0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid #2a2a4a;
            color: var(--text);
        }
        .card-header {
            background-color: rgba(233, 69, 96, 0.1);
            border-bottom: 1px solid #2a2a4a;
        }
        .navbar {
            background-color: var(--bg-card) !important;
            border-bottom: 2px solid var(--accent);
        }
        .navbar-brand {
            color: var(--accent) !important;
            font-weight: bold;
        }
        .nav-link { color: var(--text) !important; }
        .nav-link:hover { color: var(--accent) !important; }
        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background-color: #c73a52;
            border-color: #c73a52;
        }
        .badge-purple { background-color: #6c5ce7; }
        .text-muted-custom { color: var(--muted) !important; }
        .progress { background-color: #2a2a4a; height: 20px; }
        .quest-card {
            transition: transform 0.2s;
            border-left: 4px solid transparent;
        }
        .quest-card:hover { transform: translateY(-3px); }
        .quest-card.rarity-common { border-left-color: #6c757d; }
        .quest-card.rarity-uncommon { border-left-color: #198754; }
        .quest-card.rarity-rare { border-left-color: #0d6efd; }
        .quest-card.rarity-epic { border-left-color: #6c5ce7; }
        .quest-card.rarity-legendary { border-left-color: #ffc107; }
        .stat-box {
            background: linear-gradient(135deg, var(--bg-card) 0%, #1f2b47 100%);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="container py-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
