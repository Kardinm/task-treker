{% extends 'base.html' %}
{% block title %}{% endblock %}
{% block content %}
<h4>Створення акаунту</h4>
  
<form method="post">
{% csrf_token %}
{% for field in form %}
            
<label>{{ field.label }}</label>
{{ field }}
{% if field.errors %}
{{ field.errors }}
{% endif %}
{% if field.help_text %}
{{ field.help_text }}
{% endif %}

{% endfor %}
<button type="submit">Створити акаунт</button>
</form>
<hr>
<p><a href="{% url 'login' %}">Увійти</a></p>
{% endblock %}
